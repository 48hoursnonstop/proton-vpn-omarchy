name: Proton VPN for Omarchy bug
description: Report a reproducible problem in the community plugin or core
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Proton VPN for Omarchy. This is an unofficial community project, not Proton support.

        Never paste Proton credentials, authentication tokens, raw journals, private IP addresses, or VPN configuration secrets. For security vulnerabilities, use GitHub's private vulnerability reporting instead.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Omarchy plugin UI
        - Rust agent/core
        - Split tunneling service
        - Installer or packaging
        - Unsure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only the text produced by Support → Copy sanitized diagnostics. It contains no raw logs, account, IP, or connection IDs.
      render: text
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      placeholder: 4.x.x
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Screenshots are welcome after checking that they contain no personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, raw logs, private addresses, and other personal information.
          required: true
